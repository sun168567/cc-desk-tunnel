# The checks a change has to pass, the same ones run by hand before a commit. The interface tests and the
# Windows packaging are not here yet: they need a Windows machine with the bundled components.
name: check
on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The tests of the SSH service of macOS and Linux write their fixtures for zsh.
      - run: sudo apt-get install -y --no-install-recommends zsh
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: bash deploy/test-scripts.sh
  # The service as it is deployed: the image built on the machine, then every way of setting it up, on both
  # architectures a server may have. On arm64 the service's own tests run as well, for what it compiles there.
  deploy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t cc-desk-tunnel:local .
      - run: sudo bash deploy/test.sh
      - run: sudo bash deploy/test-image.sh
      - if: matrix.runner == 'ubuntu-24.04-arm'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: matrix.runner == 'ubuntu-24.04-arm'
        run: sudo apt-get install -y --no-install-recommends zsh && npm ci && npm test
  # A Docker without buildx builds with the older builder, which gives the directories it makes to root whoever
  # the build runs as. The image is built that way too, so that it goes on working where BuildKit is missing.
  deploy-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t cc-desk-tunnel:local .
        env:
          DOCKER_BUILDKIT: '0'
      - run: sudo bash deploy/test.sh
  # The parts of the client that only run on Windows. Without the bundled OpenSSH and PowerShell the tests that
  # need them skip themselves; this job is here to learn what a hosted Windows machine can run, and does not
  # hold a change back yet.
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  # The SSH service of the macOS client, with the system's own ssh, scp and sftp-server.
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
