# Builds the release files on GitHub's machines instead of a maintainer's own: the Windows installer, the
# macOS and Linux packages, the terminal client ccdt and the server bundle, each client started as a check. This is where a release
# is built: the release script names its draft in `release`, and the files are attached to it with their
# hashes. Nothing is signed with a certificate. Otherwise the files are kept with the run for 3 days; it
# runs when asked for, and on a pull request that changes what does the packaging: at every push to it, as the
# paths are those of the whole request, so that a package that fails stays failed on the request until fixed
# instead of being hidden by a later commit.
name: package
on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag of a draft release to attach the files to. Left empty, they stay with the run.
        default: ''
  pull_request:
    paths:
      - .github/workflows/package.yml
      - scripts/package-*.mjs
      - scripts/release-manifest.mjs
      - scripts/smoke-posix-package.mjs
      - scripts/prepare-windows.ps1
      - apps/cli/install/**
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
# The steps that download Electron and the packaging tools are tried a second time after a minute: those
# downloads now and then time out.
jobs:
  # The server image of the release, for amd64 and arm64 (see images.yml). It is built once every client is: an
  # image tag is never moved once pushed, so a release whose clients failed must not leave one behind, or trying
  # again after a fix would stop at the tag of the commit before.
  images:
    if: inputs.release != ''
    needs: [windows, macos, linux, cli-linux-arm64, server]
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ inputs.release }}
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Electron and the packaging tools, kept from one run to the next: they are fetched from release pages
      # that now and then time out, and change only with the versions the lock file names.
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            .tools
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/prepare-windows.ps1') }}
      - run: npm ci
      - run: npm run setup:desktop || (sleep 60 && npm run setup:desktop)
        shell: bash
      # The bundled OpenSSH and PowerShell, fetched and checked against the hashes the script names.
      - run: npm run prepare:windows:package || (sleep 60 && npm run prepare:windows:package)
        shell: bash
      # Ends with the packaged program started offline; a package that does not start fails here.
      - run: npm run package:windows || (sleep 60 && npm run package:windows)
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 3
      # The terminal client with the same bundled components, installed the way a user installs it and started
      # from where it went.
      - run: npm run package:cli
        shell: bash
      - run: |
          $folder = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ccdt"
          tar -xf (Get-Item artifacts/cli/*.zip).FullName -C $folder
          & "$folder\ccdt\install.ps1"
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          ccdt --version
          if ($LASTEXITCODE) { throw 'The installed ccdt did not start.' }
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: cli-windows-x64
          path: artifacts/cli/*.zip
          if-no-files-found: error
          retention-days: 3
  # One package for each kind of Mac, each built and started on a machine of its own kind. The picture is of
  # the window as the system draws it there.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Electron and the packaging tools, kept from one run to the next: they are fetched from release pages
      # that now and then time out, and change only with the versions the lock file names.
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            .tools
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/prepare-windows.ps1') }}
      - run: npm ci
      - run: npm run setup:desktop || (sleep 60 && npm run setup:desktop)
        shell: bash
      - run: npm run package:macos -- --${{ matrix.arch }} || (sleep 60 && npm run package:macos -- --${{ matrix.arch }})
        shell: bash
        env:
          SMOKE_SCREENSHOT: artifacts/macos/window-${{ matrix.arch }}.png
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
          if-no-files-found: error
          retention-days: 3
      - run: npm run package:cli && tar -xzf artifacts/cli/*.tar.gz -C "$RUNNER_TEMP" && "$RUNNER_TEMP/ccdt/install.sh" && ~/.local/bin/ccdt --version
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: cli-macos-${{ matrix.arch }}
          path: artifacts/cli/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      # By itself, so that it can be looked at without fetching the package.
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-window
          path: artifacts/macos/*.png
          if-no-files-found: warn
          retention-days: 3
  # The .deb, built and then installed the way a user installs it, and started from where it was installed:
  # that is where its sandbox and what it depends on are in place. A virtual screen stands in for a desktop.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick
      # Electron and the packaging tools, kept from one run to the next: they are fetched from release pages
      # that now and then time out, and change only with the versions the lock file names.
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            .tools
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/prepare-windows.ps1') }}
      - run: npm ci
      - run: npm run setup:desktop || (sleep 60 && npm run setup:desktop)
        shell: bash
      - run: npm run package:linux || (sleep 60 && npm run package:linux)
        shell: bash
      - run: sudo apt-get install -y ./artifacts/linux/*.deb
      - run: xvfb-run -a -s "-screen 0 1280x900x24" node scripts/smoke-posix-package.mjs "/opt/CC Desk Tunnel/cc-desk-tunnel"
        env:
          SMOKE_SCREENSHOT: artifacts/linux/window-x64.png
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: artifacts/linux/*.deb
          if-no-files-found: error
          retention-days: 3
      - run: npm run package:cli && tar -xzf artifacts/cli/*.tar.gz -C "$RUNNER_TEMP" && "$RUNNER_TEMP/ccdt/install.sh" && ~/.local/bin/ccdt --version
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: artifacts/cli/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-window
          path: artifacts/linux/*.png
          if-no-files-found: warn
          retention-days: 3
  # ccdt for Linux on arm64, such as an ARM server or a Raspberry Pi: there is no desktop package for it.
  cli-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run package:cli && tar -xzf artifacts/cli/*.tar.gz -C "$RUNNER_TEMP" && "$RUNNER_TEMP/ccdt/install.sh" && ~/.local/bin/ccdt --version
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux-arm64
          path: artifacts/cli/*.tar.gz
          if-no-files-found: error
          retention-days: 3
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --include=dev --workspace=@cc-desk-tunnel/desktop --workspace=@cc-desk-tunnel/protocol
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          mkdir -p artifacts/server
          node scripts/package-server.mjs "artifacts/server/cc-desk-tunnel-server-$version.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: artifacts/server/*.tar.gz
          if-no-files-found: error
          retention-days: 3
  # For the release script: every file of the release goes from here to the draft it made, described by
  # release.json and SHA256SUMS, without passing through a maintainer's computer. The only job that may
  # write to the repository.
  attach:
    if: inputs.release != ''
    needs: [windows, macos, linux, cli-linux-arm64, server, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: '{windows-x64,macos-arm64,macos-x64,linux-x64,server,cli-*}'
          merge-multiple: true
          path: downloaded
      - run: |
          mkdir release
          mv downloaded/*.exe downloaded/*.dmg downloaded/*.deb downloaded/*.tar.gz downloaded/ccdt-*.zip release/
          node scripts/release-manifest.mjs release
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
