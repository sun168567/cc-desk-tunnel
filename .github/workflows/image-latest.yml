# `latest` follows the release GitHub shows as Latest. Deployments ask for a version of their own and do not use it;
# it is there for those who write their own compose file.
name: image-latest
on:
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-latest
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the actual Latest release, including when a prerelease is promoted by hand.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if ! docker buildx imagetools inspect "$image:$version" > /dev/null 2>&1; then
            echo "Release $version has no image; latest stays where it is."
            exit 0
          fi
          docker buildx imagetools create --tag "$image:latest" "$image:$version"
