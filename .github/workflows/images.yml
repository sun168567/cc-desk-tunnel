name: images
on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
      tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source:
        description: Application ref (use vX.Y.Z to add an image to an existing release)
        default: ''
      tag:
        description: Empty builds/tests only; vX.Y.Z publishes a release; verify-NAME publishes a test image
        default: ''
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || github.sha }}
      - id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="${REQUESTED_TAG#v}"
          # Test tags stay separate from immutable release tags.
          if [[ -n "$tag" && "$REQUESTED_TAG" != verify-* && "$tag" != "$version" ]]; then
            echo 'Tag must match the application version or start with verify-.' >&2
            exit 1
          fi
          if [[ "$REQUESTED_TAG" == verify-* ]]; then tag="$REQUESTED_TAG"; fi
          [[ -z "$tag" || "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+|verify-[a-zA-Z0-9_.-]+)$ ]]
          if [[ -n "$tag" && "$tag" != verify-* ]]; then
            existing="$(git ls-remote --tags origin "refs/tags/v$version")"
            if [[ -n "$existing" ]]; then
              git fetch origin "refs/tags/v$version"
              test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse HEAD)"
            fi
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      # Keep current deployment tests even when adding an image to an older release.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: image-source
      - run: bash deploy/test-scripts.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: image-source
          file: image-source/deploy/docker/Dockerfile
          load: true
          tags: cc-desk-tunnel:local
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - run: sudo bash deploy/test.sh
      - run: sudo bash deploy/test-image.sh
      - if: needs.prepare.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.prepare.outputs.tag != ''
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          staging="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag cc-desk-tunnel:local "$staging"
          docker push "$staging" || { sleep 10; docker push "$staging"; }
          # Record an immutable digest; the other architecture can finish independently.
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$staging" \
            | grep -F "$IMAGE@" > "digest-$ARCH.txt"
      - if: needs.prepare.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-*.txt
          retention-days: 3
  publish:
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          target="$IMAGE:$TAG"
          # Never replace a released image on a retry. Verify the commit of both existing variants.
          if [[ "$TAG" != verify-* ]] && docker buildx imagetools inspect "$target" > /dev/null 2>inspect-error; then
            for arch in amd64 arm64; do
              docker pull --platform "linux/$arch" "$target"
              test "$(docker inspect --format '{{.Architecture}}' "$target")" = "$arch"
              test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$target")" = "$COMMIT"
            done
          else
            if [[ "$TAG" != verify-* ]] && ! grep -Eqi 'not found|manifest unknown' inspect-error; then
              cat inspect-error >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$target" $(cat digests/digest-*.txt)
          fi
          docker buildx imagetools inspect "$target"
          # A public source repository does not automatically make its GHCR package public.
          # Failure here asks the maintainer to set visibility once, before offering the image to users.
          mkdir -p /tmp/anonymous-docker
          DOCKER_CONFIG=/tmp/anonymous-docker docker manifest inspect "$target" > /dev/null
