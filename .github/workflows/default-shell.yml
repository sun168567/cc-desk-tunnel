# The bundled OpenSSH runs every command through the shell the computer's OpenSSH is set to use
# (HKLM\SOFTWARE\OpenSSH\DefaultShell). Each job sets one and runs the tests of the device's SSH service.
name: default-shell
on:
  push:
    branches: [dev/windows-default-shell]
  workflow_dispatch:
jobs:
  device:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [none, powershell, pwsh, git-bash]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .tools
          key: default-shell-${{ hashFiles('scripts/prepare-windows.ps1') }}
      - run: npm ci
      - run: npm run prepare:windows:package
      - name: Set the computer's OpenSSH default shell
        if: matrix.shell != 'none'
        shell: pwsh
        run: |
          $path = @{
            'powershell' = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
            'pwsh'       = (Get-Command pwsh.exe).Source
            'git-bash'   = "$env:ProgramFiles\Git\bin\bash.exe"
          }['${{ matrix.shell }}']
          if (-not (Test-Path -LiteralPath $path)) { throw "No shell at $path" }
          New-Item -Path HKLM:\SOFTWARE\OpenSSH -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -Value $path -PropertyType String -Force
      # The runner signs in as the built-in Administrator, whose folders the permission tests do not expect.
      - run: node --test --test-concurrency=1 --test-skip-pattern="reachable by this user alone|may write but not change permissions" apps/desktop/test-main/component-host.test.mjs apps/desktop/test-main/tunnel.test.mjs
